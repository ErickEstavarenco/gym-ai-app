version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gym-ai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym_ai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: gym-ai-adminer
    ports:
      - "8080:8080"
    networks:
      - gym-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  gym-network:
    driver: bridge
